# Per-category metadata for /recomendacoes/ (and /en/recommendations/) hero + cards.
# Key = the folder name (slug) under content/{pt-br/recomendacoes,en/recommendations}.
# icon: a name resolved by layouts/partials/rec-icon.html (SVG library).
# gradient: CSS gradient used as hero background (and as fallback when no image).
# image: optional background photo URL (R2, Unsplash, etc.) — leave empty for gradient-only hero.
# Add an image URL whenever you have a representative shot for the category.


[build]
command = "hugo --gc --minify"
publish = "public"

[build.environment]
HUGO_VERSION = "0.170.1"
TZ = "America/Sao_Paulo"
GIT_SUBMODULE_STRATEGY = "recursive"

[context.production]
# Phase 1-2: the "production" context here deploys to the STAGING subdomain
# (new.marcelioleal.com). HUGO_ENV is "staging" so PaperMod's robots meta emits
# noindex, nofollow. Phase 3 cutover flips this to "production" when the apex
# marcelioleal.com becomes the real production domain.
command = "hugo --gc --minify --baseURL ${URL}"
[context.production.environment]
HUGO_ENV = "staging"

[context.deploy-preview]
command = "hugo --gc --minify --baseURL ${DEPLOY_PRIME_URL}"
[context.deploy-preview.environment]
HUGO_ENV = "preview"

[context.branch-deploy]
command = "hugo --gc --minify --baseURL ${DEPLOY_PRIME_URL}"
[context.branch-deploy.environment]
HUGO_ENV = "preview"
